_version = 1

# Reference only: scripts/local_fabro.py generates the project's actual config.
[server.listen]
type = "tcp"
address = "127.0.0.1:3000"

[server.auth]
methods = ["dev-token"]

[server.web]
enabled = false

[server.sandbox.providers.local]
enabled = true

# Put provider = "local" in environments/dark-factory-local.toml beside this file.
# Environment files are separate in the pinned Fabro version.
# The setup script also supplies a storage root and private runtime credentials.
