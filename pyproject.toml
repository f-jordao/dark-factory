[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-factory"
version = "0.1.0"
description = "Deterministic software lifecycle orchestration with agents at explicit work stages."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dark-factory = "dark_factory.cli:main"

[tool.setuptools.packages.find]
include = ["dark_factory*"]
